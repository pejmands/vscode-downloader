name: Final Download VSCode

on:
  workflow_dispatch:

jobs:
  get-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest successful workflow run
        id: get_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'success',
              per_page: 1
            });
            const latestRun = runs.data.workflow_runs[0];
            console.log('Latest run ID:', latestRun.id);
            return latestRun.id;
            
      - name: Download artifact from latest run
        uses: actions/download-artifact@v4
        with:
          name: VSCode-Installer
          path: ./
          run-id: ${{ steps.get_run.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: VSCode-Setup
          name: Microsoft VS Code Installer
          files: |
            *.zip
            *.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload as artifact again (backup)
        uses: actions/upload-artifact@v4
        with:
          name: VSCode-Final
          path: |
            *.zip
            *.exe
