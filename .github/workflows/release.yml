name: Publish as GitHub Release

on:
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact from previous run
        uses: actions/download-artifact@v4
        with:
          name: VSCode-Installer
          path: ./
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.119.0
          name: VS Code Installer
          files: |
            *.zip
            *.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
